    const SIZE_LABELS = {
      broto: "Broto (4 fatias)",
      media: "Média (6 fatias)",
      grande: "Grande (8 fatias)"
    };

    function App() {
      const [activeCategory, setActiveCategory] = useState("Todas");
      const [searchTerm, setSearchTerm] = useState("");
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [showPreview, setShowPreview] = useState(false);

      const [selectedPizzaModal, setSelectedPizzaModal] = useState(null);
      const [selectedSize, setSelectedSize] = useState("grande");

      const [checkout, setCheckout] = useState({
        name: "",
        type: "delivery",
        street: "",
        number: "",
        neighborhood: "",
        payment: "pix",
        cashChange: "",
        notes: ""
      });

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const formatBRL = (val) => {
        return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      };

      const categories = ["Todas", "Pizzas Salgadas", "Pizzas Doces", "Bebidas", "Sobremesas"];

      const filteredProducts = useMemo(() => {
        return MENU_PRODUCTS.filter(item => {
          const matchCategory = activeCategory === "Todas" || item.category === activeCategory;
          const matchSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              item.description.toLowerCase().includes(searchTerm.toLowerCase());
          return matchCategory && matchSearch;
        });
      }, [activeCategory, searchTerm]);

      const handleItemClick = (product) => {
        if (product.category.includes("Pizzas")) {
          setSelectedPizzaModal(product);
          setSelectedSize("grande");
        } else {
          addToCart(product, null, product.price);
        }
      };

      const addToCart = (product, sizeKey = null, priceToUse = 0) => {
        const cartKey = sizeKey ? `${product.id}-${sizeKey}` : product.id;
        const sizeName = sizeKey ? SIZE_LABELS[sizeKey] : null;

        setCart(prev => {
          const index = prev.findIndex(item => item.cartKey === cartKey);
          if (index > -1) {
            const updated = [...prev];
            updated[index].quantity += 1;
            return updated;
          } else {
            return [...prev, {
              cartKey: cartKey,
              id: product.id,
              name: product.name,
              category: product.category,
              sizeKey: sizeKey,
              sizeName: sizeName,
              unitPrice: sizeKey ? product.prices[sizeKey] : priceToUse,
              quantity: 1,
              image: product.image
            }];
          }
        });

        setSelectedPizzaModal(null);
        showToast(`"${product.name}" adicionado ao pedido!`);
      };

      const updateQuantity = (cartKey, delta) => {
        setCart(prev => {
          return prev.map(item => {
            if (item.cartKey === cartKey) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });
      };

      const removeFromCart = (cartKey) => {
        setCart(prev => prev.filter(i => i.cartKey !== cartKey));
        showToast("Item removido.");
      };

      const subtotal = useMemo(() => {
        return cart.reduce((acc, item) => acc + (item.unitPrice * item.quantity), 0);
      }, [cart]);

      const totalItemsCount = useMemo(() => {
        return cart.reduce((acc, item) => acc + item.quantity, 0);
      }, [cart]);

      const deliveryFee = checkout.type === 'delivery' ? RESTAURANT_CONFIG.deliveryFee : 0;
      const grandTotal = subtotal + deliveryFee;

      // --- GERADOR DE TEXTO FORMATADO PARA O WHATSAPP COM QUEBRAS DE LINHA E PARÁGRAFOS RÍGIDOS (\r\n) ---
      const generateWhatsAppText = () => {
        let paragraphs = [];

        // 1. Título
        paragraphs.push(`*NOVO PEDIDO - ${RESTAURANT_CONFIG.name.toUpperCase()}*`);

        // 2. Cliente e Modalidade
        let clientInfo = `*CLIENTE:* ${checkout.name || 'Não informado'}\r\n` +
                         `*MODALIDADE:* ${checkout.type === 'delivery' ? 'Entrega em Domicílio' : 'Retirada no Balcão'}`;
        paragraphs.push(clientInfo);

        // 3. Itens do Pedido
        let itemsText = `*ITENS DO PEDIDO:*\r\n`;
        itemsText += cart.map(item => {
          const itemTotal = formatBRL(item.unitPrice * item.quantity);
          const sizeStr = item.sizeName ? ` (${item.sizeName})` : '';
          return `• ${item.quantity}x ${item.name}${sizeStr} - ${itemTotal}`;
        }).join('\r\n');
        paragraphs.push(itemsText);

        // 4. Endereço de Entrega (se aplicável)
        if (checkout.type === 'delivery') {
          let addressText = `*ENDEREÇO DE ENTREGA:*\r\n` +
            `${checkout.street || 'Rua não informada'}, Nº ${checkout.number || 'S/N'}` +
            `${checkout.neighborhood ? ` - ${checkout.neighborhood}` : ''}`;
          paragraphs.push(addressText);
        }

        // 5. Forma de Pagamento
        let paymentText = `*FORMA DE PAGAMENTO:*\r\n`;
        if (checkout.payment === 'pix') {
          paymentText += `Pix`;
        } else if (checkout.payment === 'card') {
          paymentText += `Cartão (Débito/Crédito na entrega)`;
        } else if (checkout.payment === 'cash') {
          paymentText += `Dinheiro ${checkout.cashChange ? `(Troco para R$ ${checkout.cashChange})` : '(Sem troco)'}`;
        }
        paragraphs.push(paymentText);

        // 6. Observações (se houver)
        if (checkout.notes && checkout.notes.trim()) {
          paragraphs.push(`*OBSERVAÇÕES:*\r\n${checkout.notes.trim()}`);
        }

        // 7. Resumo financeiro
        let summaryText = `*RESUMO DO VALOR:*\r\n` +
          `Subtotal: ${formatBRL(subtotal)}\r\n` +
          `Taxa de Entrega: ${checkout.type === 'delivery' ? formatBRL(deliveryFee) : 'Grátis'}\r\n` +
          `*TOTAL A PAGAR: ${formatBRL(grandTotal)}*`;
        paragraphs.push(summaryText);

        // Une cada parágrafo com linha dupla (\r\n\r\n) para garantir espaçamento visível no WhatsApp
        return paragraphs.join('\r\n\r\n');
      };

      const handleSendWhatsApp = () => {
        if (checkout.type === 'delivery' && (!checkout.street || !checkout.number)) {
          showToast("Preencha a rua e o número para a entrega!");
          return;
        }

        const text = generateWhatsAppText();
        const cleanPhone = RESTAURANT_CONFIG.whatsappNumber.replace(/\D/g, '');
        const encodedText = encodeURIComponent(text);
        
        // Utiliza o endpoint api.whatsapp.com que preserva %0D%0A como quebra de linha real no WhatsApp Web/Desktop
        const url = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodedText}`;
        window.open(url, '_blank');
      };

      const handleCopyText = () => {
        const text = generateWhatsAppText();
        navigator.clipboard.writeText(text).then(() => {
          showToast("Texto do pedido copiado com sucesso!");
        }).catch(() => {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
          showToast("Texto do pedido copiado!");
        });
      };

      return (
        <div className="min-h-screen pb-28 md:pb-12">
          
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-brand-600 text-white px-5 py-3 rounded-xl shadow-2xl font-semibold flex items-center gap-2 border border-brand-500 text-sm">
              <Icons.Check />
              <span>{toast}</span>
            </div>
          )}

          {/* CABEÇALHO */}
          <header className="relative bg-dark-card border-b border-dark-border overflow-hidden">
            <div className="absolute inset-0 z-0 opacity-25">
              <img 
                src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1600&q=80" 
                alt="Forno a Lenha" 
                className="w-full h-full object-cover"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-dark-bg via-dark-bg/80 to-transparent"></div>
            </div>

            <div className="relative z-10 max-w-5xl mx-auto px-4 py-8 md:py-12">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
                
                <div className="flex flex-col md:flex-row items-center gap-4">
                  <div className="w-20 h-20 md:w-24 md:h-24 rounded-2xl bg-gradient-to-br from-brand-600 to-brand-800 p-0.5 shadow-xl shadow-brand-900/30 flex-shrink-0">
                    <div className="w-full h-full bg-dark-bg rounded-[14px] flex flex-col items-center justify-center text-brand-500">
                      <Icons.Flame />
                      <span className="font-extrabold text-[10px] text-white tracking-widest mt-1">FORNALHA</span>
                    </div>
                  </div>

                  <div>
                    <div className="flex items-center justify-center md:justify-start gap-2 mb-1">
                      <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight text-white">
                        {RESTAURANT_CONFIG.name}
                      </h1>
                      <span className="bg-emerald-500/10 text-emerald-400 text-xs px-2.5 py-0.5 rounded-full border border-emerald-500/20 font-semibold flex items-center gap-1">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Aberto agora
                      </span>
                    </div>

                    <p className="text-gray-400 text-xs md:text-sm flex items-center justify-center md:justify-start gap-3 flex-wrap">
                      <span className="flex items-center gap-1"><Icons.Clock /> {RESTAURANT_CONFIG.hours}</span>
                      <span className="hidden md:inline">•</span>
                      <span className="flex items-center gap-1"><Icons.MapPin /> {RESTAURANT_CONFIG.address}</span>
                    </p>
                  </div>
                </div>

                <button 
                  onClick={() => setIsCartOpen(true)}
                  className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold shadow-lg shadow-brand-600/30 transition flex items-center gap-2.5"
                >
                  <Icons.ShoppingBag />
                  <span>Ver Pedido</span>
                  {totalItemsCount > 0 && (
                    <span className="bg-white text-brand-700 font-extrabold text-xs px-2 py-0.5 rounded-full">
                      {totalItemsCount}
                    </span>
                  )}
                </button>

              </div>
            </div>
          </header>

          {/* BARRA FIXA DE NAVEGAÇÃO E BUSCA */}
          <nav className="sticky top-0 z-30 bg-dark-bg/95 backdrop-blur-md border-b border-dark-border py-3 px-4 shadow-md">
            <div className="max-w-5xl mx-auto flex flex-col md:flex-row gap-3 items-center justify-between">
              
              <div className="flex items-center gap-2 overflow-x-auto w-full md:w-auto hide-scrollbar py-1">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setActiveCategory(cat)}
                    className={`px-4 py-2 rounded-xl text-xs md:text-sm font-bold whitespace-nowrap transition-all duration-200 ${
                      activeCategory === cat 
                        ? 'bg-brand-600 text-white shadow-md shadow-brand-600/20' 
                        : 'bg-dark-card text-gray-400 hover:text-white hover:bg-dark-input border border-dark-border'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              <div className="relative w-full md:w-64">
                <input 
                  type="text" 
                  placeholder="Buscar pizza, bebida..."
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  className="w-full bg-dark-card border border-dark-border rounded-xl pl-10 pr-4 py-2 text-xs md:text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-brand-600 transition"
                />
                <div className="absolute left-3 top-2.5 text-gray-500">
                  <Icons.Search />
                </div>
              </div>

            </div>
          </nav>

          {/* CONTEÚDO DA PÁGINA */}
          <main className="max-w-5xl mx-auto px-4 py-8">
            <div className="flex items-center justify-between mb-6">
              <div>
                <h2 className="text-xl md:text-2xl font-bold text-white tracking-tight">
                  {activeCategory === 'Todas' ? 'Nosso Cardápio' : activeCategory}
                </h2>
                <p className="text-xs md:text-sm text-gray-400 mt-0.5">
                  {filteredProducts.length} opçõ{filteredProducts.length === 1 ? 'ão disponível' : 'ões disponíveis'}
                </p>
              </div>
            </div>

            {filteredProducts.length === 0 ? (
              <div className="text-center py-16 bg-dark-card rounded-2xl border border-dark-border p-8">
                <div className="w-16 h-16 bg-dark-input rounded-full flex items-center justify-center mx-auto text-gray-500 mb-3">
                  <Icons.Pizza />
                </div>
                <h3 className="text-lg font-bold text-white">Nenhum item encontrado</h3>
                <p className="text-gray-400 text-sm mt-1">Tente pesquisar por outro nome ou selecionar outra categoria.</p>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredProducts.map(item => {
                  const isPizza = item.category.includes("Pizzas");
                  
                  return (
                    <div 
                      key={item.id}
                      className="bg-dark-card border border-dark-border rounded-2xl overflow-hidden hover:border-brand-600/50 transition duration-300 flex flex-col justify-between group"
                    >
                      <div className="flex p-3.5 gap-4">
                        <div className="relative w-28 h-28 md:w-32 md:h-32 rounded-xl overflow-hidden flex-shrink-0 bg-dark-input">
                          <img 
                            src={item.image} 
                            alt={item.name}
                            className="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                            onError={(e) => {
                              e.target.onerror = null;
                              e.target.src = "https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=80";
                            }}
                          />
                        </div>

                        <div className="flex-1 flex flex-col justify-between min-w-0">
                          <div>
                            <h3 className="font-bold text-white text-base md:text-lg leading-snug truncate">
                              {item.name}
                            </h3>
                            <p className="text-gray-400 text-xs line-clamp-2 mt-1 leading-relaxed">
                              {item.description}
                            </p>
                          </div>

                          <div className="mt-3 flex items-end justify-between gap-2">
                            <div>
                              {isPizza ? (
                                <div>
                                  <span className="text-[10px] text-gray-400 block font-medium">A partir de</span>
                                  <span className="text-brand-500 font-extrabold text-base md:text-lg">
                                    {formatBRL(item.prices.broto)}
                                  </span>
                                </div>
                              ) : (
                                <span className="text-brand-500 font-extrabold text-base md:text-lg">
                                  {formatBRL(item.price)}
                                </span>
                              )}
                            </div>

                            <button
                              onClick={() => handleItemClick(item)}
                              className="px-3.5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs md:text-sm transition flex items-center gap-1.5 shadow-md shadow-brand-600/20"
                            >
                              <Icons.Plus />
                              <span>{isPizza ? 'Escolher' : 'Adicionar'}</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* BARRA INFERIOR MOBILE */}
          {totalItemsCount > 0 && (
            <div className="fixed bottom-0 left-0 right-0 z-40 p-4 bg-dark-bg/90 backdrop-blur-lg border-t border-dark-border md:hidden">
              <button
                onClick={() => setIsCartOpen(true)}
                className="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 px-5 rounded-2xl shadow-xl shadow-brand-600/30 flex items-center justify-between transition"
              >
                <div className="flex items-center gap-2">
                  <span className="bg-white/20 px-2.5 py-1 rounded-lg text-xs font-black">
                    {totalItemsCount} {totalItemsCount === 1 ? 'item' : 'itens'}
                  </span>
                  <span className="text-sm">Ver Pedido</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-lg font-black">{formatBRL(grandTotal)}</span>
                  <Icons.ShoppingBag />
                </div>
              </button>
            </div>
          )}

          {/* MODAL TAMANHO PIZZA */}
          {selectedPizzaModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-dark-card border border-dark-border rounded-3xl max-w-md w-full overflow-hidden shadow-2xl">
                <div className="relative h-48 bg-dark-input">
                  <img 
                    src={selectedPizzaModal.image} 
                    alt={selectedPizzaModal.name} 
                    className="w-full h-full object-cover"
                  />
                  <button 
                    onClick={() => setSelectedPizzaModal(null)}
                    className="absolute top-3 right-3 w-9 h-9 bg-black/60 hover:bg-black text-white rounded-full flex items-center justify-center transition"
                  >
                    <Icons.X />
                  </button>
                </div>

                <div className="p-5">
                  <span className="text-[10px] font-bold text-brand-500 uppercase tracking-widest">
                    {selectedPizzaModal.category}
                  </span>
                  <h3 className="text-xl font-bold text-white mt-0.5">
                    {selectedPizzaModal.name}
                  </h3>
                  <p className="text-gray-400 text-xs md:text-sm mt-1 leading-relaxed">
                    {selectedPizzaModal.description}
                  </p>

                  <div className="my-5">
                    <label className="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-3">
                      Selecione o Tamanho:
                    </label>

                    <div className="space-y-2.5">
                      {Object.keys(selectedPizzaModal.prices).map(sizeKey => {
                        const price = selectedPizzaModal.prices[sizeKey];
                        const isSelected = selectedSize === sizeKey;
                        return (
                          <div
                            key={sizeKey}
                            onClick={() => setSelectedSize(sizeKey)}
                            className={`flex items-center justify-between p-3.5 rounded-xl border cursor-pointer transition ${
                              isSelected 
                                ? 'bg-brand-600/10 border-brand-600 text-white' 
                                : 'bg-dark-input border-dark-border text-gray-300 hover:border-gray-600'
                            }`}
                          >
                            <div className="flex items-center gap-3">
                              <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center ${
                                isSelected ? 'border-brand-500 bg-brand-500' : 'border-gray-500'
                              }`}>
                                {isSelected && <div className="w-2 h-2 rounded-full bg-white"></div>}
                              </div>
                              <span className="font-semibold text-xs md:text-sm">{SIZE_LABELS[sizeKey]}</span>
                            </div>
                            <span className="font-extrabold text-brand-500 text-sm">
                              {formatBRL(price)}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <button
                    onClick={() => addToCart(selectedPizzaModal, selectedSize)}
                    className="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2 transition text-sm"
                  >
                    <Icons.Plus />
                    <span>Adicionar • {formatBRL(selectedPizzaModal.prices[selectedSize])}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* DRAWER / CARRINHO DE COMPRAS */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-end">
              <div className="bg-dark-card border-l border-dark-border w-full max-w-md h-full flex flex-col justify-between shadow-2xl">
                
                {/* Topo do Carrinho */}
                <div className="p-4 border-b border-dark-border flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icons.ShoppingBag />
                    <h3 className="font-bold text-lg text-white">Seu Pedido</h3>
                  </div>
                  <button 
                    onClick={() => setIsCartOpen(false)}
                    className="p-2 text-gray-400 hover:text-white rounded-lg"
                  >
                    <Icons.X />
                  </button>
                </div>

                {/* Conteúdo */}
                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                  {cart.length === 0 ? (
                    <div className="text-center py-12">
                      <div className="w-16 h-16 bg-dark-input rounded-full flex items-center justify-center mx-auto text-gray-500 mb-3">
                        <Icons.ShoppingBag />
                      </div>
                      <p className="text-gray-300 font-bold">Seu carrinho está vazio</p>
                      <p className="text-gray-500 text-xs mt-1">Navegue pelo cardápio e adicione os itens desejados.</p>
                    </div>
                  ) : (
                    <>
                      {/* Lista dos Itens Selecionados */}
                      <div className="space-y-3">
                        {cart.map(item => (
                          <div 
                            key={item.cartKey}
                            className="bg-dark-input p-3 rounded-xl border border-dark-border flex items-center justify-between gap-3"
                          >
                            <div className="flex items-center gap-3 min-w-0">
                              <img src={item.image} alt={item.name} className="w-12 h-12 rounded-lg object-cover flex-shrink-0" />
                              <div className="min-w-0">
                                <h4 className="font-bold text-white text-sm truncate">{item.name}</h4>
                                {item.sizeName && (
                                  <span className="text-xs text-brand-500 font-semibold block">{item.sizeName}</span>
                                )}
                                <span className="text-xs text-gray-400 font-medium">
                                  {formatBRL(item.unitPrice)} cada
                                </span>
                              </div>
                            </div>

                            <div className="flex items-center gap-2">
                              <div className="flex items-center bg-dark-card border border-dark-border rounded-lg p-1">
                                <button 
                                  onClick={() => updateQuantity(item.cartKey, -1)}
                                  className="p-1 hover:bg-dark-border rounded text-gray-300"
                                >
                                  <Icons.Minus />
                                </button>
                                <span className="w-6 text-center text-xs font-bold text-white">{item.quantity}</span>
                                <button 
                                  onClick={() => updateQuantity(item.cartKey, 1)}
                                  className="p-1 hover:bg-dark-border rounded text-gray-300"
                                >
                                  <Icons.Plus />
                                </button>
                              </div>
                              <button 
                                onClick={() => removeFromCart(item.cartKey)}
                                className="p-1.5 text-gray-500 hover:text-rose-400 transition"
                              >
                                <Icons.Trash />
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* Formulário de Identificação e Entrega */}
                      <div className="pt-4 border-t border-dark-border space-y-3">
                        <h4 className="font-bold text-xs text-white uppercase tracking-wider">Dados do Cliente e Entrega</h4>

                        <div>
                          <label className="block text-xs font-semibold text-gray-400 mb-1">Seu Nome</label>
                          <input 
                            type="text" 
                            placeholder="Ex: João da Silva"
                            value={checkout.name}
                            onChange={(e) => setCheckout({...checkout, name: e.target.value})}
                            className="w-full bg-dark-input border border-dark-border rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-brand-600"
                          />
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <button
                            type="button"
                            onClick={() => setCheckout({...checkout, type: 'delivery'})}
                            className={`py-2 px-3 rounded-xl border text-xs font-bold transition ${
                              checkout.type === 'delivery'
                                ? 'bg-brand-600/20 border-brand-600 text-brand-500'
                                : 'bg-dark-input border-dark-border text-gray-400'
                            }`}
                          >
                            🛵 Entrega
                          </button>
                          <button
                            type="button"
                            onClick={() => setCheckout({...checkout, type: 'pickup'})}
                            className={`py-2 px-3 rounded-xl border text-xs font-bold transition ${
                              checkout.type === 'pickup'
                                ? 'bg-brand-600/20 border-brand-600 text-brand-500'
                                : 'bg-dark-input border-dark-border text-gray-400'
                            }`}
                          >
                            🏬 Retirada Balcão
                          </button>
                        </div>

                        {checkout.type === 'delivery' && (
                          <div className="space-y-2 bg-dark-input/50 p-3 rounded-xl border border-dark-border">
                            <div className="grid grid-cols-3 gap-2">
                              <div className="col-span-2">
                                <label className="block text-[11px] text-gray-400">Rua / Avenida</label>
                                <input 
                                  type="text" 
                                  placeholder="Ex: Av. Voluntário Pinheiro"
                                  value={checkout.street}
                                  onChange={(e) => setCheckout({...checkout, street: e.target.value})}
                                  className="w-full bg-dark-input border border-dark-border rounded-lg p-2 text-xs text-white focus:border-brand-600"
                                />
                              </div>
                              <div>
                                <label className="block text-[11px] text-gray-400">Nº</label>
                                <input 
                                  type="text" 
                                  placeholder="123"
                                  value={checkout.number}
                                  onChange={(e) => setCheckout({...checkout, number: e.target.value})}
                                  className="w-full bg-dark-input border border-dark-border rounded-lg p-2 text-xs text-white focus:border-brand-600"
                                />
                              </div>
                            </div>
                            <div>
                              <label className="block text-[11px] text-gray-400">Bairro</label>
                              <input 
                                type="text" 
                                placeholder="Ex: Vila Oliveira"
                                value={checkout.neighborhood}
                                onChange={(e) => setCheckout({...checkout, neighborhood: e.target.value})}
                                className="w-full bg-dark-input border border-dark-border rounded-lg p-2 text-xs text-white focus:border-brand-600"
                              />
                            </div>
                          </div>
                        )}

                        <div>
                          <label className="block text-xs font-semibold text-gray-400 mb-1">Forma de Pagamento</label>
                          <select 
                            value={checkout.payment}
                            onChange={(e) => setCheckout({...checkout, payment: e.target.value})}
                            className="w-full bg-dark-input border border-dark-border rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-brand-600"
                          >
                            <option value="pix">Pix (Chave informada via WhatsApp)</option>
                            <option value="card">Cartão (Débito/Crédito na entrega)</option>
                            <option value="cash">Dinheiro</option>
                          </select>
                        </div>

                        {checkout.payment === 'cash' && (
                          <div>
                            <label className="block text-[11px] text-gray-400 mb-1">Troco para quanto?</label>
                            <input 
                              type="number" 
                              placeholder="Ex: 100"
                              value={checkout.cashChange}
                              onChange={(e) => setCheckout({...checkout, cashChange: e.target.value})}
                              className="w-full bg-dark-input border border-dark-border rounded-xl p-2 text-xs text-white focus:border-brand-600"
                            />
                          </div>
                        )}

                        <div>
                          <label className="block text-xs font-semibold text-gray-400 mb-1">Observações</label>
                          <textarea 
                            placeholder="Ex: Sem cebola, caprichar no orégano, ponto de referência..."
                            rows="2"
                            value={checkout.notes}
                            onChange={(e) => setCheckout({...checkout, notes: e.target.value})}
                            className="w-full bg-dark-input border border-dark-border rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-brand-600"
                          ></textarea>
                        </div>

                        {/* Botão de Prévia da Mensagem */}
                        <button
                          type="button"
                          onClick={() => setShowPreview(!showPreview)}
                          className="w-full py-2 px-3 rounded-xl bg-dark-input hover:bg-dark-border text-gray-300 text-xs font-semibold flex items-center justify-center gap-2 border border-dark-border transition"
                        >
                          <Icons.Eye />
                          <span>{showPreview ? 'Ocultar Prévia da Mensagem' : 'Ver Prévia da Mensagem do WhatsApp'}</span>
                        </button>

                        {/* Caixa de Prévia Visual do Texto */}
                        {showPreview && (
                          <div className="bg-emerald-950/40 border border-emerald-600/30 rounded-xl p-3 text-xs text-emerald-200 font-mono whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto">
                            {generateWhatsAppText()}
                          </div>
                        )}

                      </div>
                    </>
                  )}
                </div>

                {/* Rodapé do Carrinho com Totais e Ações */}
                {cart.length > 0 && (
                  <div className="p-4 border-t border-dark-border bg-dark-input/40 space-y-3">
                    <div className="space-y-1 text-xs">
                      <div className="flex justify-between text-gray-400">
                        <span>Subtotal</span>
                        <span>{formatBRL(subtotal)}</span>
                      </div>
                      <div className="flex justify-between text-gray-400">
                        <span>Taxa de Entrega</span>
                        <span>{checkout.type === 'delivery' ? formatBRL(deliveryFee) : 'Grátis'}</span>
                      </div>
                      <div className="flex justify-between text-base font-extrabold text-white pt-2 border-t border-dark-border">
                        <span>Total Final</span>
                        <span className="text-brand-500">{formatBRL(grandTotal)}</span>
                      </div>
                    </div>

                    <div className="grid grid-cols-4 gap-2 pt-1">
                      <button
                        type="button"
                        onClick={handleCopyText}
                        className="col-span-1 bg-dark-input hover:bg-dark-border text-gray-300 font-bold p-3 rounded-xl border border-dark-border transition flex items-center justify-center"
                        title="Copiar texto do pedido"
                      >
                        <Icons.Copy />
                      </button>

                      <button
                        type="button"
                        onClick={handleSendWhatsApp}
                        className="col-span-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2 transition text-sm"
                      >
                        <Icons.Whatsapp />
                        <span>Pedir no WhatsApp</span>
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* RODAPÉ */}
          <footer className="mt-16 border-t border-dark-border py-8 text-center text-gray-500 text-xs">
            <div className="max-w-5xl mx-auto px-4 flex flex-col items-center gap-2">
              <div className="flex items-center gap-2 text-brand-500 font-extrabold text-sm">
                <Icons.Flame />
                <span>{RESTAURANT_CONFIG.name}</span>
              </div>
              <p>© {new Date().getFullYear()} — Cardápio Digital Interativo. Todos os direitos reservados.</p>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
